apiVersion: v1
kind: Secret
metadata:
  name: gorchestrator-secrets
  labels:
    app: gorchestrator
    component: gstack
type: Opaque
stringData:
  postgres-url: "postgres://gorchestrator:orchestrator_password@postgres:5432/gstack"
  anthropic-api-key: "your-anthropic-api-key-here"
  openai-api-key: "your-openai-api-key-here"
