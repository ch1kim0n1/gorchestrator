[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gorchestrator"
version = "0.5.0"
description = "Parallel agent execution manager for the G-Stack (Node.js CLI, pip-installable launcher)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "GOrchestrator contributors" }]
keywords = [
    "orchestrator",
    "llm",
    "multi-model",
    "task-runner",
    "ai-agent",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/ch1kim0n1/gorchestrator"
Homepage = "https://github.com/ch1kim0n1/gorchestrator#readme"
Issues = "https://github.com/ch1kim0n1/gorchestrator/issues"

[project.scripts]
gorchestrator = "gorchestrator.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["python/gorchestrator"]
# The _bundle directory contains non-Python package data (.js + .wasm) that
# must ship in the wheel. Hatchling's default file selector skips unknown
# extensions inside packages, so include them explicitly.
artifacts = [
    "python/gorchestrator/_bundle/*.js",
    "python/gorchestrator/_bundle/*.wasm",
]

[tool.hatch.build.targets.sdist]
include = [
    "python/gorchestrator",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "scripts/build_pypi.sh",
]
