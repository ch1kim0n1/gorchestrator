version: '3.8'

# GOrchestrator standalone compose.
# Depends on GBrain, GMirror, and GToM for full functionality.
# Set SANDBOX_BACKEND=inprocess to skip Docker-in-Docker for sandboxing.

services:
  gorchestrator:
    build: .
    ports:
      - '3001:8080'
    environment:
      - NODE_ENV=production
      - GORCHESTRATOR_PORT=8080
      - GBRAIN_ENDPOINT=http://gbrain:3000
      - GMIRROR_ENDPOINT=http://gmirror:3002
      - GTOM_ENDPOINT=http://gtom:3003
      - SANDBOX_BACKEND=inprocess
    volumes:
      - gorchestrator-data:/app/data
      # NOTE: the host Docker socket is intentionally NOT mounted by default.
      # Mounting /var/run/docker.sock grants the container full control of the
      # host Docker daemon (equivalent to host root / trivial container escape).
      # It is only required for SANDBOX_BACKEND=docker. To opt in explicitly,
      # use the docker-backend override: `docker compose -f docker-compose.yml -f
      # docker-compose.docker-backend.yml up` (see that file for the warning).
    depends_on:
      gbrain:
        condition: service_healthy
      gmirror:
        condition: service_healthy
      gtom:
        condition: service_healthy
    healthcheck:
      # curl/wget are absent in node:20-alpine; use a node probe. Honors HEALTH_PORT/GORCHESTRATOR_PORT.
      test:
        [
          'CMD',
          'node',
          '-e',
          "const p=process.env.HEALTH_PORT||process.env.GORCHESTRATOR_PORT||8080;require('http').get('http://localhost:'+p+'/health/live',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 1.5

  gbrain:
    build:
      context: ./gbrain
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GBRAIN_DB_PATH=/data/gbrain.db
    volumes:
      - gbrain-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0

  gmirror:
    build:
      context: ./gmirror
    ports:
      - '3002:8080'
    environment:
      - NODE_ENV=production
      - GMIRROR_PORT=8080
      - GBRAIN_ENDPOINT=http://gbrain:3000
    depends_on:
      gbrain:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0

  gtom:
    build:
      context: ./GToM
    ports:
      - '3003:8080'
    environment:
      - NODE_ENV=production
      - GTOM_PORT=8080
      - GBRAIN_ENDPOINT=http://gbrain:3000
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0

volumes:
  gorchestrator-data:
  gbrain-data:
